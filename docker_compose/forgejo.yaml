
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    container_name: forgejo
    restart: unless-stopped

    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      TZ: Europe/Helsinki

      # Public HTTPS URL
      FORGEJO__server__DOMAIN: git.lumilukko.com
      FORGEJO__server__ROOT_URL: https://git.lumilukko.com/
      FORGEJO__server__PROTOCOL: http

      # SSH clone URLs use port 2222 on the host
      FORGEJO__server__SSH_DOMAIN: git.lumilukko.com
      FORGEJO__server__SSH_PORT: "2222"

    volumes:
      - /mnt/server/Serversetup/data/forgejo:/data
      - /etc/localtime:/etc/localtime:ro

    networks:
      - web

    ports:
      # Git over SSH; not needed for HTTPS-only Git operations.
      - "2222:22"

    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik

      # HTTPS router
      - traefik.http.routers.forgejo.rule=Host(`git.lumilukko.com`)
      - traefik.http.routers.forgejo.entrypoints=websecure
      - traefik.http.routers.forgejo.tls=true
      - traefik.http.routers.forgejo.tls.certresolver=letsencrypt
      - traefik.http.services.forgejo.loadbalancer.server.port=3000

      # HTTP -> HTTPS redirect
      - traefik.http.routers.forgejo-http.rule=Host(`git.lumilukko.com`)
      - traefik.http.routers.forgejo-http.entrypoints=web
      - traefik.http.routers.forgejo-http.middlewares=forgejo-https
      - traefik.http.middlewares.forgejo-https.redirectscheme.scheme=https

  docker-in-docker:
    image: docker:dind
    container_name: dind_container
    volumes:
      - /mnt/server/Serversetup/data/dind:/var/lib/docker
    privileged: 'true'
    ports:
      - "127.0.0.1:2376:2375"
    command: ['dockerd', '-H', 'tcp://0.0.0.0:2375', '--tls=false', '--max-concurrent-uploads=1']
    restart: 'unless-stopped'

  runner:
    image: 'data.forgejo.org/forgejo/runner:13'
    depends_on:
      docker-in-docker:
        condition: service_started
    container_name: 'forgejo-runner'
    # User without root privileges, but with access to `./data`.
    user: 1000:1000
    volumes:
       - /mnt/server/Serversetup/data/forgejo/runner:/data
    restart: 'unless-stopped'
    command: 'forgejo-runner daemon --config /data/runner-config.yml'



networks:
  web:
    external: true

