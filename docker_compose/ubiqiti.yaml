services:
  unifi-os-server:
    image: giiibates/unifi-os-server:latest
    container_name: unifi-os-server
    restart: unless-stopped
    cgroup: host
    stop_signal: SIGRTMIN+3

    cap_add:
      - NET_RAW
      - NET_ADMIN

    environment:
      UOS_SYSTEM_IP: 192.168.88.241

    ports:
      - "11443:443"
      - "8080:8080"
      - "8443:8443"
      - "8444:8444"
      - "3478:3478/udp"
      - "10003:10003/udp"
      - "5514:5514/udp"
      - "5671:5671"
      - "5005:5005"
      - "6789:6789"
      - "8880:8880"
      - "8881:8881"
      - "8882:8882"
      - "9543:9543"
      - "11084:11084"

    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/lib/journal
      - /var/opt/unifi/tmp:size=64m

    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /mnt/server/Serversetup/data/unifi/persistent:/persistent
      - /mnt/server/Serversetup/data/unifi/var-log:/var/log
      - /mnt/server/Serversetup/data/unifi/data:/data
      - /mnt/server/Serversetup/data/unifi/srv:/srv
      - /mnt/server/Serversetup/data/unifi/var-lib-unifi:/var/lib/unifi
      - /mnt/server/Serversetup/data/unifi/var-lib-postgresql:/var/lib/postgresql
      - /mnt/server/Serversetup/data/unifi/var-lib-mongodb:/var/lib/mongodb
      - /mnt/server/Serversetup/data/unifi/etc-rabbitmq-ssl:/etc/rabbitmq/ssl
