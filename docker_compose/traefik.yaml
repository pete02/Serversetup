
services:
  traefik:
    container_name: Traefik
    image: traefik:latest
    restart: unless-stopped
    command:
      - --configFile=/mnt/private/Serversetup/configs/traefik.yml
    ports:
      - "80:80"
      - "443:443"
      - "8088:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/private/Serversetup/configs/traefik/traefik.yml:/etc/traefik/traefik.yml
      - /mnt/private/Serversetup/data/traefik/acme.json:/letsencrypt/acme.json
    networks:
      - web


networks:
  web:
    external: true

