
services:
  vikunja:
    image: vikunja/vikunja:latest
    container_name: vikunja
    restart: unless-stopped

    env_file:
      - ./.env

    environment:
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
      VIKUNJA_SERVICE_ENABLELINKSHARING: "false"

    volumes:
      - /mnt/server/Serversetup/data/vikunja/db:/db
      - /mnt/server/Serversetup/data/vikunja/files:/app/vikunja/files

    networks:
      - web

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.vikunja.rule=Host(`tasks.lumilukko.com`)"
      - "traefik.http.routers.vikunja.entrypoints=websecure"
      - "traefik.http.routers.vikunja.tls=true"
      - "traefik.http.routers.vikunja.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vikunja.middlewares=vikunja-allowlist"
      - "traefik.http.middlewares.vikunja-allowlist.ipallowlist.sourcerange=192.168.88.0/24,10.0.0.0/24"
      - "traefik.http.services.vikunja.loadbalancer.server.port=3456"

networks:
  web:
    external: true
