services:
  ntfy:
    image: binwiederhier/ntfy:v2.30.0
    container_name: ntfy
    command: ["serve"]
    init: true
    restart: unless-stopped
    environment:
      TZ: Europe/Helsinki
    user: "1000:1000"
    volumes:
      - /mnt/server/Serversetup/data/ntfy:/var/cache/ntfy
      - /mnt/server/Serversetup/configs/ntfy:/etc/ntfy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '"healthy"\s*:\s*true' || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ntfy.rule=Host(`ntfy.lumilukko.com`)"
      - "traefik.http.routers.ntfy.entrypoints=websecure"
      - "traefik.http.routers.ntfy.tls=true"
      - "traefik.http.routers.ntfy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ntfy.middlewares=ntfy-internal"
      - "traefik.http.middlewares.ntfy-internal.ipallowlist.sourcerange=192.168.88.0/24,10.0.0.0/24"
      - "traefik.http.services.ntfy.loadbalancer.server.port=80"

networks:
  web:
    external: true