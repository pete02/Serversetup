services:
  staging-backend:
    image: lumilukko/tribune-logistica-staging:latest
    container_name: tribune-logistica-staging
    volumes:
      - /mnt/private/Serversetup/data/staging:/data
    environment:
      - TTS_BACKEND=http
      - LIBRARY_ROOT=/data
      - TTS_API_URL=http://booklegion-tribune-dictio:8000/tts
    env_file:
      - .env
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Router for backend
      - "traefik.http.routers.staging-backend.rule=Host(`staging.lumilukko.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.staging-backend.entrypoints=websecure"
      - "traefik.http.routers.staging-backend.tls=true"
      - "traefik.http.routers.staging-backend.tls.certresolver=letsencrypt"
      # Service port inside container
      - "traefik.http.services.staging-backend.loadbalancer.server.port=8000"
    networks:
      - web

  staging-onboarder:
    image: lumilukko/tribune-archivum-staging:latest
    container_name: tribune-archivum-staging
    depends_on:
      - staging-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HARDCOVER_API_ENDPOINT=https://api.hardcover.app/v1/graphql
      - TRIBUNE_LOGISTICA_URL=http://tribune-logistica-staging:8000
      - RUST_LOG=info
    volumes:
      - /mnt/private/Serversetup/data/staging:/data
      - /mnt/private/onboard-staging:/onboard
      - /mnt/private/onboard-staging-errors:/errs
    networks:
      - web


  staging-frontend:
    image: lumilukko/lector-staging:latest
    container_name: lector-staging
    depends_on:
      - staging-backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.staging-frontend.rule=Host(`staging.lumilukko.com`)"
      - "traefik.http.routers.staging-frontend.entrypoints=websecure"
      - "traefik.http.routers.staging-frontend.tls=true"
      - "traefik.http.routers.staging-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.staging-frontend.loadbalancer.server.port=80" 
    networks:
      - web

networks:
  web:
    external: true
