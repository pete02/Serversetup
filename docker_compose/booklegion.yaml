services:
  frontend:
    image: lumilukko/lector:latest
    container_name: booklegion-lector
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"

      # Frontend router: everything except /api
      - "traefik.http.routers.booklegion-frontend.rule=Host(`book.lumilukko.com`)"
      - "traefik.http.routers.booklegion-frontend.entrypoints=websecure"
      - "traefik.http.routers.booklegion-frontend.tls=true"
      - "traefik.http.routers.booklegion-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.booklegion-frontend.loadbalancer.server.port=80"

    networks:
      - web
    restart: unless-stopped

  tribune_dictio:
    image: lumilukko/tribune_dictio
    container_name: booklegion-tribune_dictio
    ports:
      - 8888:8000
    volumes:
      - /mnt/private/Serversetup/data/audio:/voiceactors
    devices:
      - nvidia.com/gpu=all
    restart: unless-stopped
    networks:
      - web

  backend:
    image: lumilukko/tribune_logistica:latest
    container_name: booklegion-tribune_logistica
    depends_on:
      - tribune_dictio
    volumes:
      - /mnt/private/Serversetup/data/booklegion:/data
      - /mnt/private/Serversetup/configs/booklegion:/config
    labels:
      - "traefik.enable=true"

      # Backend router: /api/*
      - "traefik.http.routers.booklegion-backend.rule=Host(`book.lumilukko.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.booklegion-backend.entrypoints=websecure"
      - "traefik.http.routers.booklegion-backend.tls=true"
      - "traefik.http.routers.booklegion-backend.tls.certresolver=letsencrypt"

      # Strip /api prefix
      - "traefik.http.middlewares.booklegion-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.booklegion-backend.middlewares=booklegion-strip"

      # Internal backend port
      - "traefik.http.services.booklegion-backend.loadbalancer.server.port=8000"
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    external: true
